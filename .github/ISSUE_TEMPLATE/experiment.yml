name: Experiment
description: Propose or record an experiment.
labels: ["experiment"]
body:
  - type: input
    id: hypothesis
    attributes:
      label: Hypothesis
      description: The hypothesis this experiment tests (for example H1, H1.1, H1.2), or "exploratory".
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What this experiment should answer.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Datasets and environment splits, models, objectives, and the comparison being made.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics and analysis
      description: Metrics reported and the statistical test applied.
    validations:
      required: true
  - type: input
    id: seeds
    attributes:
      label: Seeds
    validations:
      required: true
  - type: textarea
    id: compute
    attributes:
      label: Compute estimate
      description: Expected GPU time and memory.
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Filled in after the run. Link the config, the result files and the commit.
