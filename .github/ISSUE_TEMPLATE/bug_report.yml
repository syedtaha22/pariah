name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, config file and seed.
      placeholder: |
        1. uv sync
        2. uv run ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU and driver, output of `uv run python -c "import torch; print(torch.__version__)"`.
